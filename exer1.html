<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadros</title>

    <style>
        main {
            display: grid;
            grid-template-columns: repeat(3, 160px);
            gap: 10px;
            padding: 20px;
        }

        .caixa {
            height: 80px;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
    </style>

    <script>
        window.onload = inicio;

let contador = 0;
let destino;

function inicio() {
    destino = document.querySelector("main");

    adicionarItens(30);

    window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 10) {
            adicionarItens(5);
        }
    });
}

function adicionarItens(qtd = 5) {
    for (let i = 0; i < qtd; i++) {
        contador++;

        const div = document.createElement("div");
        div.className = "caixa";
        div.textContent = "Item " + contador;

        destino.appendChild(div);
    }
}

        function novaCaixa(conteudo) {
            return `<div class="caixa">${conteudo}</div>`;
        }
    </script>
</head>

<body>
    <main>
    </main>
</body>
</html>
